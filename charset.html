<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Unicode Character Table</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --primary-color: #4a6cf7;
                --secondary-color: #6c757d;
                --bg-color: #ffffff;
                --surface-color: #f8f9fa;
                --text-color: #212529;
                --border-color: #e9ecef;
                --hover-color: #f1f5ff;
                --radius: 12px;
                --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family:
                    "Inter",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                padding: 30px;
                background-color: var(--bg-color);
                color: var(--text-color);
                line-height: 1.6;
                max-width: 1400px;
                margin: 0 auto;
            }

            h1 {
                text-align: center;
                margin-bottom: 30px;
                font-weight: 700;
                color: var(--text-color);
                font-size: 2.2rem;
            }

            .controls {
                margin-bottom: 30px;
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
            }

            .virtual-scroll-container {
                height: 70vh;
                overflow: auto;
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                position: relative;
                background-color: var(--surface-color);
                scrollbar-width: thin;
                scroll-behavior: smooth;
                will-change: scroll-position;
            }

            .virtual-scroll-container::-webkit-scrollbar {
                width: 8px;
            }

            .virtual-scroll-container::-webkit-scrollbar-track {
                background: var(--surface-color);
            }

            .virtual-scroll-container::-webkit-scrollbar-thumb {
                background-color: var(--secondary-color);
                border-radius: 20px;
            }

            .scroll-content {
                position: absolute;
                width: 100%;
                top: 0;
                left: 0;
                will-change: transform;
                contain: layout style paint;
            }

            .character-row {
                display: flex;
                border-bottom: 1px solid var(--border-color);
                padding: 4px 0;
                height: 70px;
                contain: layout style;
            }

            .character-cell {
                padding: 5px;
                flex: 1;
                text-align: center;
                transition: background-color 0.2s ease;
                cursor: pointer;
                border-radius: 8px;
                margin: 2px;
                contain: content;
            }

            .character-cell:hover {
                background-color: var(--hover-color);
                transform: translateY(-2px);
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            }

            .char-display {
                font-size: 14pt;
                min-height: 35px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .char-info {
                font-size: 0.75em;
                color: var(--secondary-color);
                font-weight: 500;
                margin-top: 3px;
            }

            .search-box {
                padding: 12px 16px;
                width: 350px;
                max-width: 100%;
                border: 1px solid var(--border-color);
                border-radius: var(--radius);
                font-size: 1rem;
                outline: none;
                transition: all 0.2s ease;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            }

            .search-box:focus {
                border-color: var(--primary-color);
                box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
            }

            #status {
                padding: 8px 16px;
                border-radius: var(--radius);
                background-color: var(--surface-color);
                font-weight: 500;
                font-size: 0.9rem;
                color: var(--secondary-color);
                box-shadow: var(--shadow);
            }

            .loading-bar {
                width: 100%;
                height: 4px;
                background-color: #eee;
                border-radius: 2px;
                margin-top: 10px;
                overflow: hidden;
                display: none;
            }

            .loading-progress {
                height: 100%;
                background-color: var(--primary-color);
                width: 0%;
                transition: width 0.3s ease;
            }

            @media (max-width: 768px) {
                body {
                    padding: 15px;
                }

                .controls {
                    flex-direction: column;
                    align-items: stretch;
                }

                .search-box {
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <h1>Unicode Character Table</h1>

        <div class="controls">
            <input
                type="text"
                class="search-box"
                placeholder="Search by name or code point..."
            />
            <div>
                <span id="status">Loading...</span>
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
            </div>
        </div>

        <div class="virtual-scroll-container">
            <div class="scroll-content"></div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const container = document.querySelector(
                    ".virtual-scroll-container",
                );
                const content = document.querySelector(".scroll-content");
                const searchBox = document.querySelector(".search-box");
                const statusDisplay = document.getElementById("status");
                const loadingBar = document.querySelector(".loading-bar");
                const loadingProgress =
                    document.querySelector(".loading-progress");

                // Configuration
                const BUFFER_SIZE = 10; // 減少: メモリ節約のため
                const BATCH_SIZE = 10000;
                const SCROLL_THROTTLE = 16;
                const TOTAL_CHARS = 0x110000;

                let rowsPerLine = 16;
                let allCharacters = new Uint32Array(TOTAL_CHARS);
                let filteredCharacters = allCharacters;
                let filteredCount = TOTAL_CHARS;
                let visibleCharacters = null;
                let totalHeight = 0;
                let startIndex = 0;
                let endIndex = 0;
                let rowHeight = 0;
                let lastScrollTime = 0;
                let searchWorker = null;

                // Initialize characters and search worker
                initSearchWorker();
                initializeCharacters();

                function initializeCharacters() {
                    statusDisplay.textContent = "Loading Unicode characters...";
                    loadingBar.style.display = "block";

                    if (window.Worker) {
                        loadCharactersWithWorker();
                    } else {
                        loadCharacterBatch(0, BATCH_SIZE);
                    }
                }

                function loadCharactersWithWorker() {
                    const workerBlob = new Blob(
                        [
                            `
                        self.onmessage = function(e) {
                            const { start, count, total } = e.data;
                            const end = Math.min(start + count, total);
                            const chunk = new Uint32Array(end - start);

                            for (let i = 0; i < chunk.length; i++) {
                                chunk[i] = start + i;
                            }

                            self.postMessage({
                                chunk,
                                progress: Math.floor((end / total) * 100),
                                done: end >= total,
                                nextStart: end
                            }, [chunk.buffer]);
                        }
                    `,
                        ],
                        { type: "application/javascript" },
                    );

                    const worker = new Worker(URL.createObjectURL(workerBlob));

                    worker.onmessage = function (e) {
                        const { chunk, progress, done, nextStart } = e.data;

                        if (chunk) {
                            allCharacters.set(chunk, nextStart - chunk.length);
                        }

                        statusDisplay.textContent = `Loading... ${progress}%`;
                        loadingProgress.style.width = `${progress}%`;

                        if (done) {
                            statusDisplay.textContent = `Loaded ${TOTAL_CHARS.toLocaleString()} characters`;
                            loadingBar.style.display = "none";
                            filteredCharacters = allCharacters;
                            filteredCount = TOTAL_CHARS;

                            // Send to search worker
                            const allCharsCopy = new Uint32Array(allCharacters);
                            searchWorker.postMessage({
                                type: 'init',
                                allCharacters: allCharsCopy,
                                totalChars: TOTAL_CHARS
                            }, [allCharsCopy.buffer]);

                            calculateRowHeight();
                            updateLayout();
                            render();
                            worker.terminate();
                        } else {
                            worker.postMessage({
                                start: nextStart,
                                count: BATCH_SIZE,
                                total: TOTAL_CHARS
                            });
                        }
                    };

                    worker.postMessage({ start: 0, count: BATCH_SIZE, total: TOTAL_CHARS });
                }

                function loadCharacterBatch(start, count) {
                    let end = Math.min(start + count, TOTAL_CHARS);
                    for (let i = start; i < end; i++) {
                        allCharacters[i] = i;
                    }

                    if (end < TOTAL_CHARS) {
                        const progress = Math.floor((end / TOTAL_CHARS) * 100);
                        statusDisplay.textContent = `Loading... ${progress}%`;
                        loadingProgress.style.width = `${progress}%`;
                        setTimeout(() => loadCharacterBatch(end, count), 0);
                    } else {
                        statusDisplay.textContent = `Loaded ${TOTAL_CHARS.toLocaleString()} characters`;
                        loadingBar.style.display = "none";
                        filteredCharacters = allCharacters;
                        filteredCount = TOTAL_CHARS;

                        // Send to search worker
                        searchWorker.postMessage({
                            type: 'init',
                            allCharacters: new Uint32Array(allCharacters),
                            totalChars: TOTAL_CHARS
                        });

                        calculateRowHeight();
                        updateLayout();
                        render();
                    }
                }

                function calculateRowHeight() {
                    const style = getComputedStyle(
                        document.querySelector(".character-row") ||
                            document.createElement("div"),
                    );
                    rowHeight = parseInt(style.height) || 70;
                }

                function updateLayout() {
                    const width = container.clientWidth;
                    if (width < 500) {
                        rowsPerLine = 4;
                    } else if (width < 800) {
                        rowsPerLine = 8;
                    } else if (width < 1200) {
                        rowsPerLine = 12;
                    } else {
                        rowsPerLine = 16;
                    }

                    const characterCount = filteredCount;
                    const numRows = Math.ceil(characterCount / rowsPerLine);
                    totalHeight = numRows * rowHeight;
                    content.style.height = `${totalHeight}px`;
                }

                function render() {
                    const scrollTop = container.scrollTop;
                    const visibleStartRow = Math.floor(scrollTop / rowHeight);
                    const visibleEndRow = Math.ceil(
                        (scrollTop + container.clientHeight) / rowHeight,
                    );

                    const bufferStartRow = Math.max(0, visibleStartRow - BUFFER_SIZE);
                    const bufferEndRow = Math.min(
                        Math.ceil(filteredCount / rowsPerLine),
                        visibleEndRow + BUFFER_SIZE,
                    );

                    startIndex = bufferStartRow * rowsPerLine;
                    endIndex = Math.min(bufferEndRow * rowsPerLine, filteredCount);
                    visibleCharacters = filteredCharacters.slice(startIndex, endIndex);

                    const topPadding = bufferStartRow * rowHeight;
                    content.style.transform = `translateY(${topPadding}px)`;
                    renderCharacters();
                }

                function renderCharacters() {
                    const fragment = document.createDocumentFragment();
                    renderGridView(fragment);
                    content.innerHTML = "";
                    content.appendChild(fragment);
                }

                function renderGridView(fragment) {
                    const rows = Math.ceil(visibleCharacters.length / rowsPerLine);

                    for (let rowIndex = 0; rowIndex < rows; rowIndex++) {
                        const row = document.createElement("div");
                        row.className = "character-row";

                        const startIdx = rowIndex * rowsPerLine;
                        const endIdx = Math.min(startIdx + rowsPerLine, visibleCharacters.length);

                        for (let i = startIdx; i < endIdx; i++) {
                            const codePoint = visibleCharacters[i];
                            const cell = document.createElement("div");
                            cell.className = "character-cell";

                            const display = document.createElement("div");
                            display.className = "char-display";
                            try {
                                display.textContent = String.fromCodePoint(codePoint);
                            } catch (e) {
                                display.textContent = "";
                            }

                            const info = document.createElement("div");
                            info.className = "char-info";
                            const hexCode = codePoint.toString(16).toUpperCase().padStart(4, "0");
                            info.textContent = `U+${hexCode}`;

                            cell.appendChild(display);
                            cell.appendChild(info);
                            row.appendChild(cell);
                        }
                        fragment.appendChild(row);
                    }
                }

                let ticking = false;
                container.addEventListener("scroll", function () {
                    const now = Date.now();
                    if (!ticking && now - lastScrollTime > SCROLL_THROTTLE) {
                        lastScrollTime = now;
                        requestAnimationFrame(function () {
                            render();
                            ticking = false;
                        });
                        ticking = true;
                    }
                }, { passive: true });

                function initSearchWorker() {
                    const workerBlob = new Blob(
                        [
                            `
                        let allChars = null;
                        self.onmessage = function(e) {
                            const { type, searchTerm, allCharacters, totalChars } = e.data;
                            if (type === 'init') {
                                allChars = new Uint32Array(allCharacters);
                                return;
                            }
                            if (!searchTerm || searchTerm.trim() === "") {
                                const resultsArray = new Uint32Array(allChars);
                                self.postMessage({ results: resultsArray, count: resultsArray.length }, [resultsArray.buffer]);
                                return;
                            }
                            const searchPattern = searchTerm.replace(/\\*/g, ".*").replace(/\\?/g, ".");
                            try {
                                const regex = new RegExp(searchPattern);
                                const results = [];
                                const len = allChars ? allChars.length : 0;
                                for (let i = 0; i < len; i++) {
                                    const codePoint = allChars[i];
                                    const hexCode = codePoint.toString(16).toLowerCase().padStart(4, "0");
                                    if (regex.test(hexCode)) {
                                        results.push(codePoint);
                                    }
                                }
                                const resultsArray = new Uint32Array(results);
                                self.postMessage({ results: resultsArray, count: resultsArray.length }, [resultsArray.buffer]);
                            } catch (e) {
                                const resultsArray = new Uint32Array(allChars);
                                self.postMessage({ results: resultsArray, count: resultsArray.length }, [resultsArray.buffer]);
                            }
                        }
                    `,
                        ],
                        { type: "application/javascript" },
                    );
                    searchWorker = new Worker(URL.createObjectURL(workerBlob));
                    searchWorker.onmessage = function(e) {
                        const { results, count } = e.data;
                        filteredCharacters = results;
                        filteredCount = count;
                        updateLayout();
                        container.scrollTop = 0;
                        render();
                        statusDisplay.textContent = `Showing ${filteredCount.toLocaleString()} characters`;
                    };
                }

                searchBox.addEventListener("input", function () {
                    const searchTerm = this.value.toLowerCase();
                    if (searchTerm.trim() === "") {
                        filteredCharacters = allCharacters;
                        filteredCount = TOTAL_CHARS;
                        updateLayout();
                        container.scrollTop = 0;
                        render();
                        statusDisplay.textContent = `Showing ${filteredCount.toLocaleString()} characters`;
                        return;
                    }
                    statusDisplay.textContent = "Searching...";
                    searchWorker.postMessage({ searchTerm, totalChars: TOTAL_CHARS });
                });

                let resizeTimeout;
                window.addEventListener("resize", function () {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(function () {
                        calculateRowHeight();
                        updateLayout();
                        render();
                    }, 100);
                }, { passive: true });
            });
        </script>
    </body>
</html>
